<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMeet - Connect, Chat, Belong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        neonPink: '#ec4899',
                        neonPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-darkBg text-white font-sans antialiased h-screen flex flex-col justify-between overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="flex justify-between items-center px-4 py-3 border-b border-gray-800 bg-cardBg/50 backdrop-blur">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-neonPink to-neonPurple flex items-center justify-center shadow-lg shadow-pink-500/30">
                <i class="fa-solid fa-fire text-white text-sm"></i>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-neonPink to-neonPurple bg-clip-text text-transparent">VibeMeet</span>
        </div>
        <div class="flex items-center space-x-3">
            <button class="w-9 h-9 rounded-full bg-gray-800/80 flex items-center justify-center text-gray-300 hover:text-white"><i class="fa-solid fa-sliders"></i></button>
            <button class="w-9 h-9 rounded-full bg-gray-800/80 flex items-center justify-center text-gray-300 hover:text-white"><i class="fa-regular fa-bell"></i></button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center relative">
        
        <!-- Vibe Deck (Profile Card) -->
        <div id="profile-card" class="w-full max-w-sm h-[70vh] bg-cardBg rounded-3xl overflow-hidden shadow-2xl border border-gray-800 relative flex flex-col justify-end">
            <!-- Background Image -->
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80" alt="Profile" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-darkBg via-darkBg/40 to-transparent"></div>
            </div>

            <!-- Profile Info Content -->
            <div class="relative z-10 p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold flex items-center gap-2">Maya Lin, 24 <i class="fa-solid fa-circle-check text-neonPink text-sm"></i></h2>
                        <p class="text-gray-300 text-sm"><i class="fa-solid fa-briefcase text-xs mr-1"></i> DJ & Visual Artist · <i class="fa-solid fa-location-dot text-xs ml-2 mr-1"></i> 2.1 km away</p>
                    </div>
                </div>
                <p class="text-gray-200 text-sm italic">"Heavy basslines & 35mm street shots"</p>
                <div class="flex flex-wrap gap-1.5 pt-1">
                    <span class="px-2.5 py-1 bg-white/10 backdrop-blur rounded-full text-xs font-medium">#Deep House</span>
                    <span class="px-2.5 py-1 bg-white/10 backdrop-blur rounded-full text-xs font-medium">#Analog Synth</span>
                    <span class="px-2.5 py-1 bg-white/10 backdrop-blur rounded-full text-xs font-medium">#Film Photography</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons (Swipe / Match) -->
        <div class="flex items-center justify-center space-x-6 mt-4 relative z-10">
            <button class="w-12 h-12 rounded-full bg-cardBg border border-gray-700 flex items-center justify-center text-gray-400 hover:text-white shadow-md"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="w-14 h-14 rounded-full bg-cardBg border border-red-500/40 flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white shadow-lg transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            <button class="w-12 h-12 rounded-full bg-cardBg border border-blue-500/40 flex items-center justify-center text-blue-400 hover:bg-blue-500 hover:text-white shadow-lg transition"><i class="fa-solid fa-bolt text-lg"></i></button>
            <button class="w-16 h-16 rounded-full bg-gradient-to-r from-neonPink to-neonPurple flex items-center justify-center text-white shadow-xl shadow-pink-500/30 transition transform hover:scale-105"><i class="fa-solid fa-heart text-2xl"></i></button>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="flex justify-around items-center py-2.5 border-t border-gray-800 bg-cardBg/80 backdrop-blur text-gray-400">
        <button class="flex flex-col items-center hover:text-neonPink transition"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1">Home</span></button>
        <button class="flex flex-col items-center text-neonPink"><i class="fa-solid fa-compass text-lg"></i><span class="text-[10px] mt-1">Discover</span></button>
        <button class="flex flex-col items-center hover:text-neonPink transition relative"><i class="fa-solid fa-comment-dots text-lg"></i><span class="absolute -top-1 right-1 w-2 h-2 bg-neonPink rounded-full"></span><span class="text-[10px] mt-1">Chats</span></button>
        <button class="flex flex-col items-center hover:text-neonPink transition"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] mt-1">Profile</span></button>
    </nav>

</body>
</html>
