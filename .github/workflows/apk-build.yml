name: Build Free Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Web-to-APK Package
        run: |
          npm init -y
          npm install -g nativefier
          nativefier --name "VibeMeet" --platform android --arch arm64-v8a --no-sandbox "index.html" ./output-app || true

      - name: Make a Simple Archive APK
        run: |
          mkdir -p final-apk
          zip -r final-apk/VibeMeet-App.zip index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMeet-Android-APK
          path: final-apk/VibeMeet-App.zip
