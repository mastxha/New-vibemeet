name: Build Free Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '18'

        - name: Install Cordova & Android Dependencies
          run: |
            npm install -g cordova
            cordova create myapp com.vibemeet.app VibeMeet
            cd myapp
            cordova platform add android

        - name: Inject HTML Code
          run: |
            cp index.html myapp/www/index.html

        - name: Build Debug APK
          run: |
            cd myapp
            cordova build android --debug

        - name: Upload APK Artifact
          uses: actions/upload-artifact@v4
          with:
            name: VibeMeet-Android-APK
            path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
