name: Build Free Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Initialize Project & Build APK
        run: |
          npm init -y
          npm install cordova@12.0.0
          npx cordova create myapp com.vibemeet.app VibeMeet
          cd myapp
          npx cordova platform add android@12.0.0 --nofetch
          cp ../index.html www/index.html
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMeet-Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
