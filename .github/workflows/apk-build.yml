name: Build Free Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Cordova Android APK
        run: |
          npm install -g cordova
          cordova telemetry off
          
          cordova create myapp com.vibemeet.app VibeMeet
          cd myapp
          cordova platform add android@12.0.0 --nofetch
          cp ../index.html www/index.html
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMeet-Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
